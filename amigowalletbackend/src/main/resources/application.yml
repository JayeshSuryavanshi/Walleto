spring:
  application:
    name: wallet-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/amigowallet_db}
    username: ${SPRING_DATASOURCE_USERNAME:walleto}
    password: ${SPRING_DATASOURCE_PASSWORD:walleto}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate never mutates it.
      ddl-auto: none
      naming:
        # Honor explicit @Table/@Column names verbatim (uppercase). The default
        # CamelCaseToUnderscoresNamingStrategy lowercases them, which breaks on
        # case-sensitive MySQL where Flyway created UPPERCASE tables.
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:3322}
  servlet:
    context-path: ${SERVER_SERVLET_CONTEXT_PATH:/AmigoWallet}
  error:
    whitelabel:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    # HS256 requires a key of >= 32 bytes; the dev default below is >= 32 bytes so the app boots without config.
    secret: ${APP_JWT_SECRET:change-me-dev-secret-change-me-32bytes-minimum-000}
    access-ttl-seconds: ${APP_JWT_ACCESS_TTL:1800}
    reset-ttl-seconds: ${APP_JWT_RESET_TTL:600}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}
  bank:
    # Server-to-server bank-api (edubank) base URL + shared service key. The browser
    # no longer calls the bank directly; wallet-api owns all bank interaction.
    base-url: ${BANK_API_BASE_URL:http://localhost:3331/EDUBank}
    api-key: ${BANK_SERVICE_API_KEY:dev-bank-service-key-change-me}

logging:
  level:
    root: INFO
    org.hibernate: INFO
