name: CI

on:
  push:
    branches: [master, modernize-2026]
  pull_request:
  workflow_dispatch:

jobs:
  wallet-api:
    name: wallet-api (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: amigowalletbackend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # TODO(Phase 8): switch to `mvn verify` once the JUnit 4 -> 5 test migration lands.
      - run: mvn -B -ntp -Dmaven.test.skip=true clean package

  bank-api:
    name: bank-api (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: edubank
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B -ntp -Dmaven.test.skip=true clean package

  frontend:
    name: frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: amigowalletfrontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: amigowalletfrontend/package-lock.json
      - run: npm install
      - run: npx ng build --configuration production

  docker-build:
    name: docker images build
    runs-on: ubuntu-latest
    needs: [wallet-api, bank-api, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build all images via compose
        run: |
          cp .env.example .env
          docker compose build
