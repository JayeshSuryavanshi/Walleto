<div class="shell auth">
  <header class="auth-top">
    <app-theme-toggle></app-theme-toggle>
  </header>

  <main class="auth-main">
    <app-wordmark size="lg" class="auth-wordmark"></app-wordmark>
    <p class="auth-tagline muted">
      {{ (mode() === 'signin' ? 'AUTH.TAGLINE_SIGNIN' : 'AUTH.TAGLINE_CREATE') | translate }}
    </p>

    <div class="card card-pad auth-card">
      @if (mode() === 'signin') {
        <app-login></app-login>
      } @else {
        <app-register></app-register>
      }
    </div>

    <p class="auth-switch">
      @if (mode() === 'signin') {
        <span class="muted">{{ 'AUTH.NO_ACCOUNT' | translate }}</span>
        <button type="button" class="link" (click)="mode.set('create')">
          {{ 'AUTH.CREATE_ACCOUNT' | translate }}
        </button>
      } @else {
        <span class="muted">{{ 'AUTH.HAVE_ACCOUNT' | translate }}</span>
        <button type="button" class="link" (click)="mode.set('signin')">
          {{ 'AUTH.SIGN_IN' | translate }}
        </button>
      }
    </p>
  </main>
</div>
