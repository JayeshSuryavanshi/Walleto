<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Walleto</title>
  <base href="/">

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Walleto — a quiet, confident wallet where your money is the hero.">
  <meta name="theme-color" content="#0C6B4F" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0D1013" media="(prefers-color-scheme: dark)">
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <!-- No-flash theme: stamp the resolved theme on <html> before first paint. -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('walleto-theme');
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) { /* private mode / no storage: fall back to CSS media query */ }
    })();
  </script>
</head>

<body>
  <app-root>
    <div class="app-boot">Loading Walleto…</div>
  </app-root>
</body>

</html>
