server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Gzip static assets
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # SPA: serve index.html for any client-side route that isn't a real file.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse-proxy the wallet-api. The browser calls same-origin /AmigoWallet/*
    # (see environment.ts) so no CORS is needed in production. The location
    # prefix is preserved because proxy_pass has no trailing path -> the request
    # reaches the wallet-api at its /AmigoWallet context path unchanged.
    location /AmigoWallet/ {
        proxy_pass         http://wallet-api:3322;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Long-cache hashed build assets.
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public";
    }
}
